[package]
authors = { workspace = true }
categories = ["concurrency", "cryptography::cryptocurrencies", "emulators"]
description = "Fuel client binary."
edition = { workspace = true }
homepage = { workspace = true }
keywords = ["blockchain", "cryptocurrencies", "fuel-vm", "vm"]
license = { workspace = true }
repository = { workspace = true }
version = { workspace = true }
name = "fuel-core-network-watchtower"
publish = true

[[bin]]
name = "network-watchtower"
path = "src/main.rs"

[features]
default = []
fault-proving = [
    "fuel-block-syncer/fault-proving",
    "fuel-core/fault-proving",
    "fuel-core-bin/fault-proving",
    "fuel-core-compression/fault-proving",
    # Works around an upstream feature-propagation bug in fuel-core 0.48.x.
    # `fuel-core-bin` depends on `fuel-core-block-aggregator-api` unconditionally, but
    # only `fuel-core`'s `fault-proving` forwards to it, and it does so with a `?`
    # ("fuel-core-block-aggregator-api?/fault-proving") that fires only when *fuel-core*
    # enables that optional dependency - i.e. only under `fuel-core/rpc`. Without `rpc`,
    # `fuel-core-types` gets `fault-proving` (5-argument `Block::new`, `BlockHeader::V2`)
    # while the aggregator is compiled without it, and the aggregator fails to build.
    # Enabling `rpc` here restores the forwarding. Drop this once upstream lists the
    # aggregator in `fuel-core-bin`'s own `fault-proving` feature.
    "fuel-core-bin/rpc",
]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
dotenvy = "0.15"
fuel-block-syncer = { workspace = true }
fuel-core = { workspace = true }
fuel-core-bin = { workspace = true }
fuel-core-compression = { workspace = true }
fuel-core-services = { workspace = true }
fuel-network-watchtower-downloader = { workspace = true }
futures-util = { workspace = true }
tikv-jemallocator = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
url = { workspace = true }
